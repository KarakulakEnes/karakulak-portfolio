<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <rect x="80" y="60" width="640" height="330" rx="12" fill="#0f0f1a" stroke="#6366f1" stroke-width="2"/>
  <text x="120" y="120" fill="#6366f1" font-family="monospace" font-size="18">&gt; student_portal.exe</text>
  <text x="120" y="160" fill="#a0a0b8" font-family="monospace" font-size="14">[1] Login</text>
  <text x="120" y="190" fill="#a0a0b8" font-family="monospace" font-size="14">[2] Course Registration</text>
  <text x="120" y="220" fill="#a0a0b8" font-family="monospace" font-size="14">[3] Grade Tracking</text>
  <text x="120" y="250" fill="#a0a0b8" font-family="monospace" font-size="14">[4] Exit</text>
  <rect x="120" y="290" width="200" height="30" rx="4" fill="url(#accent1)" opacity="0.3"/>
  <text x="130" y="310" fill="#6366f1" font-family="monospace" font-size="14">Select option: _</text>
  <text x="400" y="400" fill="#6366f1" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Student Portal</text>
  <text x="400" y="430" fill="#6b6b80" font-family="sans-serif" font-size="14" text-anchor="middle">C++ CLI Application</text>
</svg>
